# Optional: requires MAESTRO_EMAIL and MAESTRO_PASSWORD in the environment.
appId: pk.alwahabco.manzil
---
- launchApp
- tapOn:
    id: "tab-account"
- tapOn:
    id: "account-sign-in"
- tapOn:
    id: "login-email"
- inputText: "${MAESTRO_EMAIL}"
- tapOn:
    id: "login-password"
- inputText: "${MAESTRO_PASSWORD}"
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "account-screen"
- assertVisible:
    id: "account-sign-out"
